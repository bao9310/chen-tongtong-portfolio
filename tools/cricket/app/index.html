<script>/* Cricket Studio: deterministic, offline editorial assistance. No model API is called. */
(function (root) {
  'use strict';

  var SOURCE = 'https://cricketmedia.com/cricket-magazine-intro/';
  var SOURCE_DATE = '2026-09-12';
  var FACTS = [
    ['F1', '适读年龄：9–14 岁。'],
    ['F2', '出版频率：每年 6 期。'],
    ['F3', '内容体裁：小说、非虚构、诗歌。'],
    ['F4', '主题方向：文化、历史、科学、艺术。']
  ];
  var CATEGORY_ORDER = ['内容事实', '表达风险', '交付素材', '版本一致'];
  var STATUS_META = [
    { key: 'approved', label: '已批准', color: '#35896b' },
    { key: 'blocked', label: '待补正', color: '#c26751' },
    { key: 'ready', label: '待人工审核', color: '#d0a34d' },
    { key: 'unchecked', label: '待检查', color: '#91a19b' }
  ];

  function str(value) { return value == null ? '' : String(value); }
  function compact(value) { return str(value).replace(/\s+/g, ''); }
  function nonempty(value) { return str(value).trim().length > 0; }
  function snippet(text, match) {
    if (!match) return '';
    var start = typeof match.index === 'number' ? match.index : text.indexOf(str(match));
    if (start < 0) return '';
    return text.slice(Math.max(0, start - 14), Math.min(text.length, start + str(match[0] || match).length + 26));
  }

  function generateBrief(c, angle) {
    c = c || {};
    angle = angle || c.angle || '共读体验';
    var variants = {
      '共读体验': {
        goal: '用一段亲子共读过程，帮助 9–14 岁孩子的家长判断这份英文读物是否适合自己的共读场景。',
        freedom: '可自行选择阅读位置、镜头节奏和真实感受；如无真实共读记录，使用场景演示，不编造孩子反馈或学习效果。',
        hook: '给 9–14 岁孩子选英文读物时，我会先看：有没有一个让我们愿意一起读下去的故事？',
        scenes: [
          '开场：用桌面与阅读环境建立共读场景，点明 9–14 岁；未实际使用时标注“场景演示”。',
          '展开：通过自制图卡介绍每年 6 期，以及小说、非虚构、诗歌三类内容；从文化、历史、科学、艺术中选一个共读切入点。',
          '收尾：演示如何围绕一段内容提一个开放问题，给出选刊考虑，不承诺提分或阅读能力提升。'
        ],
        cta: '你更想从文化、历史、科学还是艺术开始共读？在评论区留下你的选择。'
      },
      '选刊攻略': {
        goal: '围绕适读年龄、出版频率、内容体裁和主题，用一张选刊清单降低家长的信息比较成本。',
        freedom: '可调整信息展示顺序、选刊维度和个人偏好；比较其他刊物时需要另外提供来源，不编造排名、测评结果或教学效果。',
        hook: '选英文杂志前，先核对四件事：给谁读、多久一期、有哪些体裁、覆盖什么主题。',
        scenes: [
          '开场：展示自制四格选刊清单，提出“是否适合我家”的选择问题。',
          '展开：逐项填入 9–14 岁、每年 6 期、小说/非虚构/诗歌、文化/历史/科学/艺术；使用自己的版式，不复制无授权内页。',
          '收尾：解释家长还需要结合孩子现有阅读水平与兴趣判断适配度，避免把年龄范围等同于效果保证。'
        ],
        cta: '先收藏这份四格清单，再到品牌官方页面查看当前产品信息。'
      },
      '课堂实操': {
        goal: '演示一个围绕杂志主题设计的课堂讨论活动，帮助教师理解内容如何接入教学准备。',
        freedom: '可自选文化、历史、科学或艺术主题，调整提问与分组方式；没有真实课堂记录时必须标注模拟，不虚构学生参与或教学成效。',
        hook: '如果把一段阅读内容变成一个讨论问题，这节课可以怎样开始？',
        scenes: [
          '开场：在白板写下一个科学或文化类开放问题，标注“课堂活动模拟”，说明内容适读年龄为 9–14 岁。',
          '展开：用自制文字卡介绍每年 6 期、小说/非虚构/诗歌，以及文化/历史/科学/艺术主题；演示阅读、提问、讨论三个步骤。',
          '收尾：展示一份可调整的讨论任务卡，说明活动设计需要根据班级基础调整，不承诺成绩提升。'
        ],
        cta: '你会把哪个主题带进课堂？在评论区分享你的活动设计。'
      }
    };
    var result = variants[angle] || variants['共读体验'];
    return JSON.parse(JSON.stringify(result));
  }

  function check(c) {
    c = c || {};
    var text = str(c.draftText);
    var t = compact(text);
    var deliveries = c.deliverables || {};
    var items = [];
    function add(id, label, pass, category, note, suggestion, excerpt) {
      items.push({ id: id, label: label, pass: Boolean(pass), category: category, note: note,
        suggestion: pass ? '请继续人工核对原文语义及对应材料。' : suggestion, excerpt: excerpt || '' });
    }

    var ageGood = /9(?:[-–—~～]|至|到)14(?:周)?岁/.exec(t);
    var ages = Array.from(t.matchAll(/(\d{1,2})(?:[-–—~～]|至|到)(\d{1,2})(?:周)?岁/g));
    var wrongAge = ages.find(function (m) { return Number(m[1]) !== 9 || Number(m[2]) !== 14; });
    add('F1', '适读年龄 · 9–14 岁', ageGood && !wrongAge, '内容事实',
      '检查年龄范围关键词；通过仍需人工判断年龄是否指向本产品、是否被否定。',
      wrongAge ? '发现其他年龄范围，请核实产品描述并统一为官方的 9–14 岁。' : '在产品介绍中补充适读年龄“9–14 岁”。',
      snippet(t, wrongAge || ageGood));

    var frequencyGood = /(?:每年|一年|全年|年刊|每一?年)(?:共|出版|发行|推出|有|为|是|：|:)?(?:6|六)期/.exec(t);
    var frequencies = Array.from(t.matchAll(/(?:每年|一年|全年|年刊|每一?年)(?:共|出版|发行|推出|有|为|是|：|:)?([\d一二三四五六七八九十两]+)期/g));
    var wrongFrequency = frequencies.find(function (m) { return m[1] !== '6' && m[1] !== '六'; });
    wrongFrequency = wrongFrequency || /(?:每月|月刊|每周|周刊|每季度|季刊)(?:共|出版|发行|推出|有|为|是|：|:)?(?:\d+|[一二三四五六七八九十两]+)?期?/.exec(t);
    add('F2', '出版频率 · 每年 6 期', frequencyGood && !wrongFrequency, '内容事实',
      '检查年刊期数和常见频率冲突；请人工核对上下文及实际产品版本。',
      wrongFrequency ? '存在频率冲突，请统一为“每年 6 期”，并移除未经核实的其他频率。' : '补充准确频率“每年 6 期”（也支持“每年六期”）。',
      snippet(t, wrongFrequency || frequencyGood));

    var fictionText = t.replace(/非小说/g, '');
    var genrePass = /小说/.test(fictionText) && /非虚构/.test(t) && /诗歌/.test(t);
    add('F3', '内容体裁 · 小说 / 非虚构 / 诗歌', genrePass, '内容事实',
      '仅核对三个体裁词是否出现；人工判断其是否为准确、肯定的产品描述。',
      '补全“小说、非虚构、诗歌”三类体裁，避免把非虚构简化为小说。',
      snippet(t, /小说|非虚构|诗歌/.exec(t)));

    var missingThemes = ['文化', '历史', '科学', '艺术'].filter(function (word) { return t.indexOf(word) < 0; });
    add('F4', '主题方向 · 文化 / 历史 / 科学 / 艺术', missingThemes.length === 0, '内容事实',
      '仅识别主题关键词；需人工确认各主题是否准确指向产品内容。',
      '补充缺少的主题：' + missingThemes.join('、') + '。',
      snippet(t, /文化|历史|科学|艺术/.exec(t)));

    var risky = Array.from(t.matchAll(/保证(?:\d+天)?(?:提分|提高|提升|学会|有效|效果)|包提分|(?:必然|一定|必定|肯定)(?:能|会)?(?:提分|提高|提升|学会)|(?:百分之百|100%)(?:有效|提分|提升|见效)|(?:立刻|马上|立即)(?:见效|提分)|(?:\d+|[一二三四五六七八九十]+)天(?:就能|即可|必|保证)?(?:提分|精通|掌握)|(?:提高|提升|涨|提)\d+分/g));
    var activeRisk = risky.find(function (m) {
      var prefix = t.slice(Math.max(0, m.index - 8), m.index);
      return !/(?:不|不能|不会|不应|不得|避免|切勿|不要|并非|无法|没有|未|绝不|不做|不作|不提供|不承诺)[“"‘']?$/.test(prefix);
    });
    add('R1', '表达风险 · 无明确效果保证', !activeRisk, '表达风险',
      '关键词规则只能提示部分夸大表达；通过不代表无风险，需人工审核暗示、对比及教学效果表述。',
      '移除或改写“' + (activeRisk ? activeRisk[0] : '效果保证') + '”；描述适用场景与内容特点，不承诺提分。',
      snippet(t, activeRisk));

    var cta = /评论(?:区)?|留言|收藏|关注|查看|了解更多|点击|前往|访问|分享你的|留下你的|官方(?:页面|网站)|主页/.exec(t);
    add('R2', '行动引导 · 明确 CTA', Boolean(cta), '表达风险',
      '识别行动引导词；请人工确认存在完整、清楚且符合平台要求的行动句。',
      '增加一个明确 CTA，例如“你更感兴趣哪个主题？在评论区留下你的选择”。', snippet(t, cta));

    add('D1', '交付素材 · 脚本', deliveries.script === true && nonempty(text), '交付素材',
      '依据脚本交付勾选及当前脚本文本检查；仍需人工确认提交内容完整。',
      '粘贴完整脚本，并确认已交付脚本。', deliveries.script ? (nonempty(text) ? '已标记脚本交付；已填写文本。' : '脚本已勾选，但文本为空。') : '脚本未标记交付。');
    add('D2', '交付素材 · 视频粗剪', deliveries.video === true, '交付素材',
      '依据交付记录检查，无法观看或验证视频；请人工打开原文件核对。',
      '补交视频粗剪并更新交付勾选；可填写预览链接供人工审核。', deliveries.video ? '已标记视频粗剪交付。' : '视频粗剪未标记交付。');
    add('D3', '交付素材 · 封面', deliveries.cover === true, '交付素材',
      '依据交付记录检查，无法读取或验证封面画面；需人工审核。',
      '补交封面并更新交付勾选。', deliveries.cover ? '已标记封面交付。' : '封面未标记交付。');
    add('D4', '交付素材 · 来源与授权记录', nonempty(c.licenseNote) && c.licenseConfirmed === true, '交付素材',
      '仅检查记录非空且人工确认已勾选；这不是版权真实性或法律合规判断。',
      '逐项填写画面、内页、图片及音乐的来源和使用授权，并由人工确认记录。',
      nonempty(c.licenseNote) ? str(c.licenseNote).slice(0, 140) : '尚未填写素材来源与授权记录。');
    var versionGood = c.version != null && c.draftVersion != null && str(c.version) === str(c.draftVersion);
    add('V1', '版本一致 · 稿件与当前 Brief', versionGood, '版本一致',
      '仅比较版本字段；即使编号一致，也需人工确认稿件已落实本次 Brief 改动。',
      '根据当前 Brief 修订稿件，再将稿件关联版本更新至 v' + str(c.version) + ' 并重新检查。',
      '当前 Brief v' + str(c.version) + ' / 稿件关联 v' + str(c.draftVersion));

    var blockers = items.filter(function (item) { return !item.pass; });
    return { items: items, passed: items.length - blockers.length, total: items.length, blockers: blockers, ready: blockers.length === 0 };
  }

  function status(c) {
    c = c || {};
    var result = check(c);
    if (c.decision === 'returned') return { key: 'blocked', label: '已退回修改', kind: 'red' };
    if (!result.ready) return { key: 'blocked', label: '待补正', kind: 'red' };
    var currentCheck = c.checked === true && c.revision != null && c.checkedRevision === c.revision;
    if (!currentCheck) return { key: 'unchecked', label: '待检查', kind: 'neutral' };
    if (c.decision === 'approved' && c.humanConfirmed === true && nonempty(c.reviewNote)) {
      return { key: 'approved', label: '已批准', kind: 'green' };
    }
    return { key: 'ready', label: '待人工审核', kind: 'amber' };
  }

  function metrics(creators) {

let previews=new Map(),listMode='table',riskCategory='';
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved.schema===3&&Array.isArray(saved.creators)&&saved.creators.length===6&&saved.creators.every(c=>typeof c.id==='string'&&typeof c.draftText==='string'&&c.brief&&Array.isArray(c.brief.scenes)&&c.deliverables&&Number.isFinite(c.version)&&Number.isFinite(c.revision))){state=saved;state.events=Array.isArray(state.events)?state.events:[];state.sim={...Engine.makeInitial().sim,...state.sim};if(!state.creators.some(c=>c.id===state.selected))state.selected=state.creators[0].id;}}}catch(e){storageOK=false;}
state.creators.forEach(c=>{c.history.forEach(h=>{if(h.version===c.version&&!h.brief){h.brief=clone(c.brief);h.angle=c.angle;}});});
const selected=()=>state.creators.find(c=>c.id===state.selected)||state.creators[0];
const fmt=n=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1});
const badge=s=>`<span class="badge ${s.kind}">${esc(s.label)}</span>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;} $('saveStatus').innerHTML=`<span class="live-dot"></span> ${storageOK?'本地已保存':'仅本次会话 · 请导出'}`;}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3400);}
function log(text){state.events.unshift({text,at:new Date().toISOString()});state.events=state.events.slice(0,60);}
function invalidate(c){c.revision++;c.checked=false;c.checkedRevision=0;c.decision='pending';c.humanConfirmed=false;c.reviewNote='';}
function navigate(next,id){if(id)state.selected=id;view=navs.some(n=>n[0]===next)?next:'overview';if(location.hash.slice(1)!==view)history.replaceState(null,'','#'+view);save();render();window.scrollTo({top:0,behavior:'instant'});}
function head(title,desc,actions='',eyebrow='CRICKET / CONTENT OPERATIONS'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;}
function render(){window.CricketMotion?.dispose();const m=Engine.metrics(state.creators);$('nav').innerHTML=navs.map(([id,label])=>`<button class="nav-item ${view===id?'active':''}" data-action="navigate" data-view="${id}" aria-current="${view===id?'page':'false'}" title="${label}">${icon(id)}<span>${label}</span>${id==='review'?`<span class="nav-count">${m.blocked+m.ready+m.unchecked}</span>`:''}</button>`).join('');$('crumb').textContent=navs.find(n=>n[0]===view)[1];$('main').innerHTML=({overview:renderOverview,brief:renderBrief,review:renderReview,insights:renderInsights,about:renderAbout}[view])();window.CricketMotion?.enter($('main'));if(view==='review')mountPreview();save();}
function renderOverview(){
 const m=Engine.metrics(state.creators),approvedPct=Math.round(m.approved/m.total*100),todo=m.total-m.approved;
 const priority=state.creators.map(c=>{const r=Engine.check(c);if(c.decision==='returned')r.blockers=[...r.blockers,{suggestion:'人工退回：'+c.reviewNote}];return {c,r};}).filter(x=>x.r.blockers.length).sort((a,b)=>b.r.blockers.length-a.r.blockers.length).slice(0,3);
 return head('内容协作控制台','掌握每一份稿件的质量、风险与下一步。',`<button class="btn" data-action="export-project">${icon('download')} 导出项目</button><button class="btn primary" data-action="batch-check">${icon('spark')} 批量检查返稿</button>`,'WORKSPACE / CRICKET CONTENT PROGRAM')+`
 <section class="command-banner">
  <div class="command-copy"><div class="eyebrow"><span class="live-dot"></span> PROJECT AT A GLANCE</div><h2>${todo?`${todo} 份稿件，等待向前一步。`:'本轮内容，已完成全部审核。'}</h2><p>${m.blocked} 份待补正 · ${m.ready} 份待人工审核 · ${m.unchecked} 份待检查</p><div class="command-meta"><span>CRICKET 杂志内容合作</span><span>6 位创作者 · 模拟项目</span><button data-action="navigate" data-view="brief">定制 Brief ${icon('arrow')}</button></div></div>
  <div class="command-orbit"><svg viewBox="0 0 144 144" data-ring aria-hidden="true"><circle cx="72" cy="72" r="61" fill="none" stroke="#ffffff18" stroke-width="7"/><circle cx="72" cy="72" r="61" fill="none" stroke="#c7e6ad" stroke-width="7" stroke-linecap="round" stroke-dasharray="383.27" stroke-dashoffset="${383.27*(1-approvedPct/100)}" transform="rotate(-90 72 72)" data-ring-length="383.27" data-ring-target="${383.27*(1-approvedPct/100)}"/></svg><div class="orbit-copy"><strong><span data-count-to="${approvedPct}">${approvedPct}</span><small>%</small></strong><span>人工批准进度</span></div><span class="orbit-foot">${m.approved} / ${m.total} 份稿件</span></div>
 </section>
 <section class="kpis" aria-label="当前项目指标">
 ${kpi('合作创作者',m.total,'位','people','本轮独立协作对象',false)}
 ${kpi('待补正稿件',m.blocked,'份','alert',`${m.issueCount} 项规则问题待处理`,true)}
 ${kpi('待人工审核',m.ready,'份','review','字段检查通过，等待终审',false)}
 ${kpi('规则项通过率',m.coverage,'%','check',`${state.creators.reduce((n,c)=>n+Engine.check(c).passed,0)} / ${m.total*11} 项通过 · 非终审率`,false)}
 </section>
 <div class="overview-analysis"><section class="panel matrix-panel"><div class="panel-head"><div><h2>创作者检查矩阵</h2><p>定位缺项，点击任一行查看依据</p></div><div class="matrix-key"><span><i class="pass"></i>通过</span><span><i class="fail"></i>待补正</span></div></div>${qualityMatrix()}<div class="insight-note">${icon('about')}每个方格对应 1 项检查。规则仅校验字段与关键词，语义和素材仍需人工确认。</div></section>
 <section class="panel"><div class="panel-head"><div><h2>风险构成</h2><p>点击分类，筛选相关稿件</p></div><span class="tiny-tag">${m.issueCount} ITEMS</span></div>${riskChart(m)}</section></div>
 <section class="panel pipeline-panel"><div class="panel-head"><h2>交付状态分布</h2><span class="meta">互斥状态 · 按稿件数统计</span></div><div class="pipeline-strip" role="group" aria-label="交付状态">${m.statuses.filter(s=>s.count).map(s=>`<button class="pipeline-segment" data-action="filter" data-filter="${s.key}" style="width:${s.count/m.total*100}%;--segment:${s.color}" aria-label="筛选${s.label}${s.count}份"><span>${s.count}</span></button>`).join('')}</div><div class="pipeline-legend">${[['unchecked','待检查','#91a19b'],['blocked','待补正','#c26751'],['ready','待人工审核','#d0a34d'],['approved','已批准','#35896b']].map(([key,label,color])=>`<button data-action="filter" data-filter="${key}"><i style="background:${color}"></i>${label}<b>${m[key]}</b></button>`).join('')}<span>更新 Brief 或稿件后，自动触发重审</span></div></section>
 <section class="panel dashboard-table" id="creatorTable"><div class="panel-head"><div><h2>创作者协作清单 <span class="count-chip">${m.total}</span></h2><p>从概览切换到具体动作</p></div><div class="actions"><div class="view-switch" role="group" aria-label="清单显示方式"><button class="${listMode==='table'?'active':''}" data-action="list-mode" data-mode="table" aria-pressed="${listMode==='table'}">${icon('brief')}列表</button><button class="${listMode==='cards'?'active':''}" data-action="list-mode" data-mode="cards" aria-pressed="${listMode==='cards'}">${icon('overview')}卡片</button></div><button class="btn small" data-action="export-csv">${icon('download')}导出</button></div></div>
 <div class="table-tools"><div class="filters">${[['all','全部',m.total],['blocked','待补正',m.blocked],['ready','待人工审',m.ready],['approved','已批准',m.approved],['unchecked','待检查',m.unchecked]].map(([key,label,count])=>`<button class="filter ${filter===key?'active':''}" data-action="filter" data-filter="${key}" aria-pressed="${filter===key}">${label}<span>${count}</span></button>`).join('')}</div><label class="search-wrap">${icon('search')}<input id="creatorSearch" aria-label="搜索创作者或平台" placeholder="搜索创作者、平台…" value="${esc(search)}"></label></div>
 ${riskCategory?`<div class="active-filter"><span>风险分类：${esc(riskCategory)}</span><button data-action="clear-category" aria-label="清除风险分类">×</button></div>`:''}
 <div id="creatorListArea">${renderCreatorList()}</div><div class="table-bottom"><span id="resultsCount">当前展示 ${filteredCreators().length} / ${m.total} 位创作者 · 演示数据</span><span>点击“速览”查看问题与稿件摘要</span></div></section>
 <div class="lower-grid"><section class="panel"><div class="panel-head"><h2>优先处理</h2><span class="meta">按问题数排序</span></div><div class="priority-list">${priority.map(({c,r},i)=>`<div class="priority-item"><span class="priority-icon">0${i+1}</span><div class="p-text"><b>${esc(c.name)} <span class="muted">· ${r.blockers.length} 项待处理</span></b><p>${esc(r.blockers[0].suggestion)}</p></div><button class="btn small" data-action="open-review" data-id="${c.id}">去处理 ↗</button></div>`).join('')||'<div class="empty">没有待补正问题，继续检查与人工终审。</div>'}</div></section><section class="panel"><div class="panel-head"><h2>协作动态</h2><span class="meta">最近操作</span></div><div class="activity">${activityHTML()}</div></section></div>`;
}
function kpi(label,value,unit,ico,foot,red){return `<div class="kpi ${red?'kpi-attention':''}"><div class="kpi-top"><span>${label}</span><span class="metric-icon">${icon(ico)}</span></div><div class="kpi-number"><strong class="metric-value" data-count-to="${value}">${value}</strong><span class="unit">${unit}</span></div><div class="kpi-foot">${red?'<span class="red-dot"></span>':''}${foot}</div></div>`;}
function qualityMatrix(){const cats=['内容事实','表达风险','交付素材','版本一致'];return `<div class="matrix-wrap"><div class="matrix-head"><span>创作者</span>${cats.map(c=>`<span>${c}</span>`).join('')}<span>通过</span></div>${state.creators.map(c=>{const r=Engine.check(c);return `<button class="matrix-row" data-action="quick-view" data-id="${c.id}" aria-label="速览${esc(c.name)}，${r.passed}项通过，${r.blockers.length}项待补正"><span class="matrix-person"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span><span><b>${esc(c.name)}</b><small>${esc(c.platform)}</small></span></span>${cats.map(cat=>`<span class="matrix-cell" title="${cat}：${r.items.filter(i=>i.category===cat&&i.pass).length}/${r.items.filter(i=>i.category===cat).length} 项通过">${r.items.filter(i=>i.category===cat).map(i=>`<i class="${i.pass?'pass':'fail'}"></i>`).join('')}</span>`).join('')}<span class="matrix-count">${r.passed}<small>/11</small></span></button>`;}).join('')}</div>`;}
function filteredCreators(){return state.creators.filter(c=>(filter==='all'||Engine.status(c).key===filter)&&(!riskCategory||Engine.check(c).blockers.some(i=>i.category===riskCategory))&&(`${c.name} ${c.type} ${c.platform} ${c.angle}`).toLowerCase().includes(search.toLowerCase()));}
function creatorRows(){return filteredCreators().map(c=>{const r=Engine.check(c),s=Engine.status(c);return `<tr><td><div class="person"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span><div><b>${esc(c.name)}</b><small>${esc(c.platform)} · ${c.id}</small></div></div></td><td><span class="angle-pill">${esc(c.angle)}</span></td><td><span class="muted">v${c.version} / </span><span class="${c.version===c.draftVersion?'':'version-warning'}">v${c.draftVersion}</span></td><td><div class="coverage-cell"><span class="tiny-track"><i style="width:${r.passed/r.total*100}%"></i></span>${r.passed}/${r.total}</div></td><td>${badge(s)}</td><td><div class="row-actions"><button class="text-btn" data-action="quick-view" data-id="${c.id}">速览</button><button class="btn small" data-action="open-review" data-id="${c.id}">${s.key==='approved'?'查看记录':s.key==='blocked'?'处理问题':'审核稿件'} ↗</button></div></td></tr>`;}).join('')||'<tr><td colspan="6"><div class="empty">没有匹配的创作者。<button class="text-btn" data-action="clear-filters">清除全部筛选 ↗</button></div></td></tr>';}
function renderCreatorList(){if(listMode==='cards')return `<div class="task-card-grid">${filteredCreators().map(c=>{const r=Engine.check(c);return `<article class="task-card"><div class="task-card-top"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span>${badge(Engine.status(c))}</div><h3>${esc(c.name)}</h3><p>${esc(c.platform)} · ${esc(c.angle)}</p><div class="task-card-progress"><span>检查项通过 <b>${r.passed}/${r.total}</b></span><div class="tiny-track"><i style="width:${r.passed/r.total*100}%"></i></div></div><p class="card-next">${esc(r.blockers[0]?.suggestion||(c.decision==='returned'?'人工退回：'+c.reviewNote:Engine.status(c).key==='approved'?'当前版本已记录人工批准。':'继续完成人工语义与素材核对。'))}</p><div class="task-card-bottom"><button class="text-btn" data-action="quick-view" data-id="${c.id}">速览</button><button class="btn small" data-action="open-review" data-id="${c.id}">进入审核 ↗</button></div></article>`;}).join('')||'<div class="empty">没有匹配的创作者。<button class="text-btn" data-action="clear-filters">清除全部筛选 ↗</button></div>'}</div>`;return `<div class="table-scroll"><table><thead><tr><th>创作者</th><th>内容方向</th><th>Brief / 返稿</th><th>检查项通过</th><th>当前状态</th><th>操作</th></tr></thead><tbody id="creatorRows">${creatorRows()}</tbody></table></div>`;}
function riskChart(m){const colors=['#779883','#d39b78','#aab999','#9eafb8'];const length=2*Math.PI*87;let offset=0;return `<div class="pro-donut-container"><div class="pro-donut-graphic"><svg class="pro-donut-svg" viewBox="0 0 240 240" role="group" aria-label="${m.categories.map(c=>c.label+c.count+'项').join('，')}"><circle cx="120" cy="120" r="87" fill="none" stroke="#edf0eb" stroke-width="22"/>${m.categories.filter(c=>c.count).map(c=>{const i=m.categories.indexOf(c),part=c.count/m.issueCount*length,start=offset;offset+=part;return `<circle class="risk-segment" data-category="${c.label}" cx="120" cy="120" r="87" fill="none" stroke="${colors[i]}" stroke-width="22" stroke-dasharray="${Math.max(0,part-5)} ${length-Math.max(0,part-5)}" stroke-dashoffset="${-start}" transform="rotate(-90 120 120)" data-action="risk-filter" data-category-label="${c.label}" tabindex="0" role="button" aria-label="筛选${c.label}，${c.count}项"><title>${c.label} · ${c.count}项 · ${Math.round(c.count/m.issueCount*100)}%</title></circle>`;}).join('')}</svg><div class="pro-donut-center"><strong id="donutValue" data-count-to="${m.issueCount}">${m.issueCount}</strong><span id="donutLabel">待补正检查项</span><small id="donutPercent">${m.blocked} 份稿件待处理</small></div></div><div class="pro-legend">${m.categories.map((c,i)=>`<button class="pro-legend-button ${riskCategory===c.label?'active':''}" data-action="risk-filter" data-category-label="${c.label}" data-count="${c.count}" data-total="${m.issueCount}" aria-label="筛选${c.label}，${c.count}项"><i style="background:${colors[i]}"></i><span>${c.label}</span><b>${c.count}</b><small>${m.issueCount?Math.round(c.count/m.issueCount*100):0}%</small><span class="legend-arrow">↗</span></button>`).join('')}</div></div><div class="insight-note">${icon('about')}按失败检查项计数。同一稿件可包含多类问题。</div>`;}
function quickView(id){const c=state.creators.find(c=>c.id===id);if(!c)return;const r=Engine.check(c);modal('稿件速览',`<div class="quick-person"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span><div><h3>${esc(c.name)}</h3><p>${esc(c.platform)} · ${esc(c.angle)} · ${c.id}</p></div>${badge(Engine.status(c))}</div><div class="quick-scores">${['内容事实','表达风险','交付素材','版本一致'].map(cat=>{const its=r.items.filter(i=>i.category===cat);return `<div><b>${its.filter(i=>i.pass).length}<small>/${its.length}</small></b><span>${cat}</span></div>`;}).join('')}</div><div class="quick-version"><span>当前 Brief <b>v${c.version}</b></span><span>稿件关联 <b class="${c.draftVersion!==c.version?'version-warning':''}">v${c.draftVersion}</b></span></div><h4>下一步建议</h4>${c.decision==='returned'?`<div class="quick-issue"><span>人工意见</span><p>${esc(c.reviewNote)}</p></div>`:''}${r.blockers.map(i=>`<div class="quick-issue"><span>${i.id} · ${esc(i.label)}</span><p>${esc(i.suggestion)}</p></div>`).join('')||`<div class="notice">${Engine.status(c).key==='approved'?'当前版本已有人工批准记录。':'已配置规则未发现阻断项，继续检查与人工复核。'}</div>`}<h4>稿件摘要</h4><p class="quick-excerpt">${esc(c.draftText||'尚未填写稿件')}</p><div class="quick-bottom"><button class="btn" data-action="drawer-brief" data-id="${c.id}">编辑 Brief</button><button class="btn primary" data-action="drawer-review" data-id="${c.id}">进入返稿审核 ${icon('arrow')}</button></div>`);$('dialog').classList.add('quick-dialog');}
function commandPalette(){modal('快速前往',`<label class="command-search">${icon('search')}<input id="commandSearch" type="text" placeholder="搜索页面或创作者…" aria-label="搜索页面或创作者"></label><div id="commandResults">${commandResults('')}</div><p class="command-hint">↑ ↓ 选择 · Enter 打开 · Esc 关闭</p>`);$('dialog').classList.add('command-dialog');$('commandSearch').focus();}
function commandResults(q){const pages=navs.filter(([id,label])=>label.toLowerCase().includes(q.toLowerCase())),people=state.creators.filter(c=>(c.name+c.platform+c.angle).includes(q));return `<div class="command-results" role="group" aria-label="匹配结果">${pages.length?'<div class="command-group-label">工作空间</div>':''}${pages.map(([id,label])=>`<button class="command-result" data-action="command-open" data-view="${id}">${icon(id)}<span>${label}</span><small>页面 ↵</small></button>`).join('')}${people.length?'<div class="command-group-label">创作者</div>':''}${people.map(c=>`<button class="command-result" data-action="command-open" data-view="review" data-id="${c.id}"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span><span>${esc(c.name)}</span><small>${esc(c.platform)} ↵</small></button>`).join('')}${!pages.length&&!people.length?'<div class="empty">没有匹配的页面或创作者</div>':''}</div>`;}

function activityHTML(){const events=state.events.slice(0,3);if(!events.length)return `<div class="activity-row"><i></i><div><p>演示项目已就绪：6 份不同问题的返稿</p><small>初始示例 · 无真实协作记录</small></div></div><div class="activity-row"><i></i><div><p>先处理缺项，再核对画面与授权</p><small>点击“处理问题”开始体验</small></div></div><div class="activity-row"><i></i><div><p>4 项产品信息已对照官方页面核验</p><small>核验日期 2026.09.12</small></div></div>`;return events.map(e=>`<div class="activity-row"><i></i><div><p>${esc(e.text||e.action||'项目记录')}</p><small>${esc(formatDate(e.at))} · 本地操作</small></div></div>`).join('');}
function formatDate(date){const d=new Date(date);return Number.isNaN(+d)?'演示初始记录':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function creatorAside(){return `<aside class="panel creator-aside"><div class="panel-head"><h2>选择创作者</h2><span class="meta">06</span></div><div class="creator-list">${state.creators.map(c=>`<button class="creator-option ${c.id===state.selected?'active':''}" data-action="select" data-id="${c.id}" aria-pressed="${c.id===state.selected}"><span class="avatar" style="--avatar:${esc(c.color)}">${esc(c.initials)}</span><span><b>${esc(c.name)}</b><small>${esc(c.platform)} · Brief v${c.version}</small><br>${badge(Engine.status(c))}</span></button>`).join('')}</div><div class="aside-note">每位创作者独立保留 Brief 草稿、返稿、审核结果与版本记录。</div></aside>`;}
function renderBrief(){const c=selected(),b=c.workingBrief||c.brief,angle=c.workingAngle||c.angle;return head('Brief 工作室','统一必须说清的信息，给创作者留出自己的表达。',`<button class="btn" data-action="export-brief">${icon('download')} 导出已保存 Brief</button><button class="btn primary" data-action="open-review" data-id="${c.id}">前往返稿审核 ${icon('arrow')}</button>`)+`<div class="editor-layout">${creatorAside()}<section class="panel"><div class="editor-body"><div class="person-header"><div><h2>${esc(c.name)}</h2><p>${esc(c.audience)} · ${esc(c.platform)}</p></div><span class="badge green">已保存 Brief v${c.version}</span></div><div class="step-label"><span>1</span> 选择内容切入点</div><div class="angle-options">${[['共读体验','从家庭共读场景切入'],['选刊攻略','把产品信息变成选择依据'],['课堂实操','用一个活动展示使用场景']].map(([a,desc],i)=>`<button class="angle ${a===angle?'active':''}" data-action="angle" data-angle="${a}" aria-pressed="${a===angle}"><span class="angle-num">0${i+1}</span><b>${a}</b><small>${desc}</small></button>`).join('')}</div><div class="notice">本地模板会按切入点生成开头与镜头建议。可继续编辑，也可导出结构化提示词用于 AI 深化。</div><div class="step-label"><span>2</span> 编辑创作任务 <span class="tiny-tag" style="width:auto;border-radius:4px;padding:0 5px">自动暂存</span></div>
<label class="field"><span>视频目标 <small>让谁了解什么、采取什么行动</small></span><textarea data-brief="goal" maxlength="3000">${esc(b.goal)}</textarea></label><label class="field"><span>开头建议 <small>基于创作者场景，而非套用口号</small></span><textarea data-brief="hook" maxlength="3000">${esc(b.hook)}</textarea></label>
<div class="step-label"><span>3</span> 镜头结构与表达边界</div>${b.scenes.map((s,i)=>`<div class="scene"><span class="scene-num">镜头 ${i+1}</span><textarea data-scene="${i}" aria-label="镜头${i+1}内容" maxlength="3000">${esc(s)}</textarea></div>`).join('')}<div class="two-cols"><label class="field"><span>创作自由空间</span><textarea data-brief="freedom" maxlength="3000">${esc(b.freedom)}</textarea></label><label class="field"><span>行动引导 CTA</span><textarea data-brief="cta" maxlength="3000">${esc(b.cta)}</textarea></label></div><div class="subtle-label">每份稿件的共同信息要求</div><div class="facts-inline"><span class="fact-token"><code>F1</code>9–14 岁</span><span class="fact-token"><code>F2</code>每年 6 期</span><span class="fact-token"><code>F3</code>小说 / 非虚构 / 诗歌</span><span class="fact-token"><code>F4</code>文化 / 历史 / 科学 / 艺术</span></div><label class="field"><span>本次改版说明 <small>保存新版本时必填</small></span><input id="revisionReason" type="text" maxlength="500" value="${esc(c.workingReason||'')}" placeholder="例如：增加共读提问镜头，CTA 改为评论互动"></label><div class="editor-actions"><span class="saved-draft" id="draftIndicator">${c.workingBrief?'有未发布草稿 · 导出仍使用已保存版本':'当前内容与已保存版本一致'}</span><div class="actions"><button class="btn" data-action="prompt">${icon('spark')} 导出 AI 提示词</button><button class="btn primary" data-action="save-version">保存为 v${c.version+1}</button></div></div><details><summary>版本记录与历史 Brief（${c.history.length}）</summary>${[...c.history].reverse().map(h=>`<div class="history-entry"><b>v${h.version} · ${esc(h.reason)}</b><p>${esc(formatDate(h.at))}</p>${h.brief?`<button class="text-btn" data-action="history" data-version="${h.version}">查看该版 Brief ↗</button>`:'<span class="subtle-label">原始演示仅保留变更说明</span>'}</div>`).join('')}</details></div></section></div>`;}
function renderReview(){const c=selected(),r=Engine.check(c);return head('返稿审核','从具体问题出发，完成修改、复检与人工决定。',`<button class="btn" data-action="export-review">${icon('download')} 导出修改单</button><button class="btn primary" data-action="run-check">${icon('spark')} 检查当前返稿</button>`)+`<div class="editor-layout">${creatorAside()}<div><section class="panel"><div class="editor-body" style="padding-bottom:0"><div class="person-header"><div><h2>${esc(c.name)} <span class="subtle-label">/ ${c.id}</span></h2><p>${esc(c.angle)} · 当前 Brief v${c.version}</p></div><div id="reviewStatus">${badge(Engine.status(c))}</div></div></div><div class="review-grid" style="padding:0 18px 18px"><div><label class="field no-margin"><span>返稿口播脚本 <small>编辑自动保存，并使旧检查失效</small></span><textarea id="draftText" class="script-area" maxlength="20000" placeholder="粘贴待检查的口播脚本…">${esc(c.draftText)}</textarea></label><div class="review-tools"><span id="charCount">${c.draftText.length} 字符</span><button class="text-btn" data-action="sample-script">载入合格示例脚本 ↗</button></div><label class="field"><span>稿件关联的 Brief 版本</span><select id="draftVersion">${Array.from({length:c.version},(_,i)=>`<option value="${i+1}" ${c.draftVersion===i+1?'selected':''}>v${i+1}${i+1===c.version?' · 当前版本':''}</option>`).join('')}</select></label><p class="subtle-label">修订稿件后再关联新版；仅改版本号不能证明内容已落实。</p></div><section class="panel" id="reviewResults">${reviewResults(c,r)}</section></div></section>
<div class="two-cols top-gap"><section class="panel"><div class="panel-head"><h2>交付与素材记录</h2><span class="meta">人工填写</span></div><div class="compact-fields"><div class="deliverables">${[['script','完整脚本'],['video','视频粗剪'],['cover','封面图']].map(([key,label])=>`<label class="check-label"><input type="checkbox" data-delivery="${key}" ${c.deliverables[key]?'checked':''}>${label}</label>`).join('')}</div><label class="field"><span>素材来源与授权记录</span><textarea id="licenseNote" maxlength="10000" placeholder="逐项记录画面、图片、音乐的来源、授权范围与凭证位置。">${esc(c.licenseNote)}</textarea></label><label class="check-label"><input id="licenseConfirmed" type="checkbox" ${c.licenseConfirmed?'checked':''}><span>已人工核对来源记录与使用授权<br><small>工具仅校验字段，无法鉴别授权真伪。</small></span></label></div></section><section class="panel"><div class="panel-head"><h2>视频人工预览</h2><span class="meta">仅本地会话</span></div><div class="compact-fields"><div class="preview-box" id="previewBox"></div><label class="file-field">选择本地视频（不会上传）<input class="file-field" id="videoFile" type="file" accept="video/*"></label><label class="field"><span>或使用视频直链</span><input id="videoUrl" type="url" value="${esc(c.videoUrl)}" placeholder="https://…/video.mp4" maxlength="3000"></label><div class="actions"><button class="btn small" data-action="load-url">加载预览</button><button class="text-btn" data-action="clear-video">清除预览</button></div><p class="subtle-label" id="videoMessage">外链需为可播放媒体地址；平台分享页不一定支持预览。</p></div></section></div>
<section class="panel human-panel" id="humanPanel">${humanPanel(c)}</section></div></div>`;}
function reviewResults(c,r){const stale=!c.checked||c.checkedRevision!==c.revision;return `<div class="score-summary"><div><strong>${r.passed}<span> / ${r.total}</span></strong><p>检查项通过数 · 不是 AI 评分</p></div><span class="score-circle">${Math.round(r.passed/r.total*100)}%</span></div><div class="checks">${stale?'<div class="notice amber">内容已变更，以下为即时预检查。请运行正式检查后再做人工决定。</div>':`<div class="notice ${r.ready?'':'red'}">${r.ready?'字段检查已通过，请继续人工核对语义、画面与授权。':`发现 ${r.blockers.length} 项待补正。根据下列建议修订后重新检查。`}</div>`}${r.blockers.map(checkItem).join('')}${r.ready?'<div class="all-pass">✓ 未发现已配置规则中的阻断项</div>':''}<details ${r.ready?'open':''}><summary>查看已通过项（${r.passed}）</summary>${r.items.filter(i=>i.pass).map(checkItem).join('')}</details></div>`;}
function checkItem(i){return `<div class="check-item ${i.pass?'pass':'fail'}"><div class="check-title"><span class="result-icon">${i.pass?'✓':'!'}</span>${esc(i.label)}<span class="rule-id">${i.id}</span></div>${i.excerpt?`<blockquote>${esc(i.excerpt)}</blockquote>`:''}${!i.pass?`<div class="suggestion">建议：${esc(i.suggestion)}</div>`:''}<p>${esc(i.note)}</p></div>`;}
function humanPanel(c){const r=Engine.check(c),isCurrent=c.checked&&c.checkedRevision===c.revision;return `<h3>人工终审决定 ${badge(Engine.status(c))}</h3><p>核对真实语义、画面、口播、字幕、音乐、封面与授权；演示记录不代表真实素材已通过审核。</p><label class="check-label"><input id="humanConfirmed" type="checkbox" ${c.humanConfirmed?'checked':''}><span>我已完成人工复核，并确认当前稿件落实了 Brief 要求</span></label><label class="field"><span>审核备注 <small>作出人工决定时必填</small></span><textarea id="reviewNote" maxlength="5000" placeholder="记录核对依据、需要修改的位置或通过原因…">${esc(c.reviewNote)}</textarea></label><div class="human-actions"><button class="btn primary" id="approveButton" data-action="approve" ${!r.ready||!isCurrent||!c.humanConfirmed||!c.reviewNote.trim()?'disabled':''}>${icon('check')} 人工批准</button><button class="btn" data-action="return">退回修改</button><button class="text-btn" data-action="open-brief" data-id="${c.id}">查看当前 Brief ↗</button></div><p class="subtle-label" id="approvalHint">${!r.ready?'需先修复所有阻断项。':!isCurrent?'请先检查当前版本。':!c.humanConfirmed||!c.reviewNote.trim()?'完成人工确认并填写备注后可批准。':'批准仅对当前内容与版本有效；修改会撤销原决定。'}${c.decision==='returned'?' 最近决定：已退回修改。':''}</p>`;}
function refreshBadges(){document.querySelectorAll('.creator-option[data-id]').forEach(el=>{const person=state.creators.find(c=>c.id===el.dataset.id);const old=el.querySelector('.badge');if(person&&old)old.outerHTML=badge(Engine.status(person));});const m=Engine.metrics(state.creators),count=document.querySelector('.nav-count');if(count)count.textContent=m.blocked+m.ready+m.unchecked;}
function refreshReview(invalidated=false){if(view!=='review')return;refreshBadges();const c=selected(),r=Engine.check(c);$('reviewResults').innerHTML=reviewResults(c,r);$('reviewStatus').innerHTML=badge(Engine.status(c));if(invalidated)$('humanPanel').innerHTML=humanPanel(c);else updateApprove();$('charCount').textContent=c.draftText.length+' 字符';}
function updateApprove(){const c=selected(),r=Engine.check(c),checked=c.checked&&c.checkedRevision===c.revision;refreshBadges();$('approveButton').disabled=!(r.ready&&checked&&c.humanConfirmed&&c.reviewNote.trim());$('approvalHint').textContent=!r.ready?'需先修复所有阻断项。':!checked?'请先检查当前版本。':!c.humanConfirmed||!c.reviewNote.trim()?'完成人工确认并填写备注后可批准。':'批准仅对当前内容与版本有效；修改会撤销原决定。';}
function mountPreview(){const c=selected(),item=previews.get(c.id);const box=$('previewBox');box.replaceChildren();if(!item){box.innerHTML=icon('play')+'<p>添加视频，核对真实画面与口播<br>预览不会自动识别视频内容</p>';return;}const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=item.src;video.setAttribute('aria-label',c.name+'的视频预览');video.addEventListener('error',()=>{if(view==='review'&&selected().id===c.id)$('videoMessage').textContent='视频无法播放。请检查媒体格式、外链权限，或选择本地视频。';});box.append(video);$('videoMessage').textContent='当前预览：'+item.name;}
function simCalc(){const s=state.sim,before=s.count*s.roundsBefore*s.minutesBefore/60,after=s.count*s.roundsAfter*s.minutesAfter/60;return {before,after,saved:before-after,rate:before?(before-after)/before*100:0};}
function range(key,label,min,max,unit){const val=state.sim[key];return `<div class="range-field"><label for="sim-${key}">${label}<output id="out-${key}">${val} ${unit}</output></label><input type="range" id="sim-${key}" data-sim="${key}" min="${min}" max="${max}" step="1" value="${val}"><div class="range-labels"><span>${min} ${unit}</span><span>${max} ${unit}</span></div></div>`;}
function renderInsights(){return head('效率测算','把“提效”拆成可讨论、可验证的业务假设。',`<button class="btn" data-action="export-sim">${icon('download')} 导出测算说明</button>`)+`<div class="notice amber">以下为计划测算，不是工具实测效果，也不代表简历中的历史业绩。每位创作者按 1 份稿件计算；轮次包含首次审核。</div><div class="scenario-presets"><span>测算假设</span><button class="btn small" data-action="sim-preset" data-preset="pilot">6 人试跑</button><button class="btn small" data-action="sim-preset" data-preset="standard">50 人协作</button><button class="btn small" data-action="sim-preset" data-preset="intensive">100 人高频审核</button></div><div class="sim-layout"><section class="panel"><div class="panel-head"><h2>调整你的协作规模</h2><span class="meta">拖动实时计算</span></div><div class="sim-inputs">${range('count','创作者数量',1,100,'位')}${range('roundsBefore','原流程平均审核轮次',1,6,'轮')}${range('minutesBefore','原流程单次审核耗时',1,60,'分钟')}${range('roundsAfter','工具辅助后预计轮次',1,6,'轮')}${range('minutesAfter','工具辅助后单次预计耗时',1,60,'分钟')}</div></section><section class="panel sim-output" id="simResult">${simResults()}</section></div><div id="sensitivityArea">${sensitivityChart()}</div><div class="sim-assumptions"><div class="assumption"><b>01 / 对齐比较口径</b><p>对比相同内容类型、审核要求和协作规模，同时记录生成、纠错与人工复核的总时间。</p></div><div class="assumption"><b>02 / 记录真实耗时</b><p>试跑时按每份稿件记录开始、结束、修改轮次与误报项，补上真实的前后对照样本。</p></div><div class="assumption"><b>03 / 同时检查质量</b><p>除了平均耗时，还观察首稿通过率、返工次数、漏检率，避免只看速度。</p></div></div><section class="panel top-gap prose"><h2>如何将这一版变成可验证的提效案例</h2><p>选取同类稿件，分别用原流程和工具辅助流程审核。固定检查标准，记录每轮开始与结束时间，由同一口径的人工终审判断质量；将模板准备和错误纠正耗时一并计入，再比较中位耗时与返工轮次。</p><p>当前页面已打通输入、检查、修订、人工决定与导出。接入真实模型后，还需用人工标注样本评估误报和漏报，才能报告实际提效比例。</p></section>`;}
function simResults(){const s=state.sim,v=simCalc(),max=Math.max(v.before,v.after,1),positive=v.saved>=0;return `<div class="sim-hero"><div><div class="eyebrow">预计${positive?'释放':'增加'}的审核时间</div><strong class="metric-value"><span id="simSavedValue" data-count-to="${Math.abs(v.saved)}" data-count-digits="1">${fmt(Math.abs(v.saved))}</span><small>小时 / 批次</small></strong><p>基于当前 ${s.count} 位创作者的计划场景</p></div><div class="sim-badge"${positive?'':' style="background:var(--red-bg);color:var(--red)"'}><b>${positive?'−':'+'}${fmt(Math.abs(v.rate))}%</b><span>预计审核耗时变化</span></div></div><div class="bar-chart" role="img" aria-label="原流程${fmt(v.before)}小时，辅助后${fmt(v.after)}小时"><div class="bar-row"><div class="bar-top"><span>原有审核流程</span><b>${fmt(v.before)} h</b></div><div class="bar-track"><div class="bar-fill" style="width:${v.before/max*100}%"></div></div><div class="formula">${s.count} 位 × ${s.roundsBefore} 轮 × ${s.minutesBefore} 分钟 ÷ 60</div></div><div class="bar-row"><div class="bar-top"><span>工具辅助后 · 假设</span><b>${fmt(v.after)} h</b></div><div class="bar-track"><div class="bar-fill after" style="width:${v.after/max*100}%"></div></div><div class="formula">${s.count} 位 × ${s.roundsAfter} 轮 × ${s.minutesAfter} 分钟 ÷ 60</div></div></div><div class="notice ${positive?'':'red'}">${positive?'测算成立的前提：减少的重复核对时间，大于新增的工具操作与纠错时间。':'当前假设下，使用工具增加了审核耗时。应先优化操作成本或返工轮次，再评估是否值得使用。'}</div><p class="formula">测算范围：稿件审核。未计入一次性搭建、培训、素材制作与沟通等待时间。实际节省需另行实测。</p>`;}
function renderAbout(){return head('项目说明与事实库','业务来源、产品信息、演示假设，各有清楚的边界。',`<button class="btn" data-action="reset">重置演示数据</button>`)+`<div class="about-layout"><div><section class="panel prose"><div class="eyebrow">FROM EXPERIENCE TO PRODUCT</div><h2>KOC 协作经验的工具化实践</h2><p>这份作品基于陈彤彤简历中的中国图书进出口有限公司平台运营经历：管理 50+ 位垂直 KOC、沉淀差异化 Brief，并协同内容供给、商品信息与授权资料。</p><p>将高频工作抽象成可复用流程：先明确产品事实与创作边界，再审核内容和交付记录，最后由人工确认并保留版本与决定。</p><h3>这一版解决的具体问题</h3><div class="boundary-row"><b>Brief 同质化</b><p>提供共读体验、选刊攻略、课堂实操三个方向，每位创作者独立编辑与保存。</p></div><div class="boundary-row"><b>重复核对</b><p>把硬信息、常见效果承诺、CTA、素材交付和版本一致性转为 11 项可解释检查。</p></div><div class="boundary-row"><b>状态难跟踪</b><p>修改即时改变问题分布；批准只对当前已检查的内容生效，版本更新触发重审。</p></div><h3>与产品运营能力的对应</h3><p>从一线协作中识别需求，用字段与状态设计定义流程，保留检查依据和操作记录，再通过统一口径的测算与实测评估价值。</p></section><section class="panel prose top-gap"><h2>数据与能力边界</h2><div class="boundary-row"><b>简历经历</b><p>50+ KOC 是简历陈述的历史协作规模；本页没有接入历史运营明细，不将其作为当前项目数据。</p></div><div class="boundary-row"><b>演示数据</b><p>6 位创作者、稿件、平台、授权说明和初始批准记录全部为虚构，用于演示不同审核情境。</p></div><div class="boundary-row"><b>本地辅助</b><p>Brief 使用模板；检查使用关键词和字段规则。未连接实时 AI，不理解全部语义，不分析视频画面或判定授权真实性。</p></div><div class="boundary-row"><b>本地存储</b><p>字段保存在当前浏览器；视频文件仅在当前会话预览，不会上传。建议导出项目备份；更换浏览器或清理数据可能丢失本地编辑。</p></div><div class="boundary-row"><b>AI 扩展</b><p>可以导出当前 Brief 的结构化提示词，在模型中深化文案。模型输出应回填并接受同样检查与人工复核；本页不保存 API 密钥。</p></div></section></div><div><section class="panel prose"><h2>产品事实库 <span class="badge green">官方来源</span></h2><p class="subtle-label">核验日期：2026.09.12 · 后续使用前请核对官网变更</p>${[['F1','适读年龄为 9–14 岁','年龄范围不等于对每个孩子的阅读水平承诺。'],['F2','每年出版 6 期','以官方介绍为准；购买时另核对具体订阅产品。'],['F3','内容包括小说、非虚构和诗歌','将体裁信息转译为可理解的选刊依据。'],['F4','覆盖文化、历史、科学与艺术','可从中选一个方向展开，但需完整交代主题范围。']].map(([id,fact,note])=>`<div class="source-row"><b><span class="fact-token">${id}</span> ${fact}</b><p>${note}</p><a href="https://cricketmedia.com/cricket-magazine-intro/" target="_blank" rel="noopener noreferrer">Cricket Media 官方产品介绍 ↗</a></div>`).join('')}<h3>原版 F5 的处理</h3><p>原版把“有利于提升英语阅读水平”列为必带事实。新版将其移出硬信息清单，创作重点改为内容特点与使用场景，不把阅读效果承诺作为必须传播的卖点。</p><p>公开产品事实不等于获得杂志内页、图片、音乐等素材的使用授权。请分别记录来源与可用范围。</p></section><section class="panel prose top-gap"><h2>建议的演示顺序</h2><ol><li>在总览查看待补正稿件。</li><li>打开知夏读书笔记的返稿，补充授权记录并人工确认，重新检查。</li><li>进入 Brief 工作室，编辑镜头并保存新版，观察旧稿触发重审。</li><li>修订脚本、关联版本、重新检查，再填写人工决定。</li><li>导出修改单，到效率测算中调整协作规模。</li></ol><button class="btn primary" data-action="open-review" data-id="K2">开始体验这个流程 ${icon('arrow')}</button></section></div></div>`;}
function modal(title,body){$('dialog').classList.remove('quick-dialog','command-dialog','scan-dialog');$('dialogTitle').textContent=title;$('dialogBody').innerHTML='<div class="dialog-body">'+body+'</div>';if(!$('dialog').open)$('dialog').showModal();}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 '+name);}
function safeName(name){return name.replace(/[\\/:*?"<>|\r\n]/g,'_').slice(0,70);}
function reviewText(c){const r=Engine.check(c);return `# ${c.name} · 返稿修改单\n\n导出时间：${new Date().toLocaleString('zh-CN')}\n数据类型：本地演示 / 手工编辑\nBrief v${c.version} / 稿件关联 v${c.draftVersion}\n状态：${Engine.status(c).label}\n检查是否为当前内容：${c.checked&&c.checkedRevision===c.revision?'是':'否，内容变更后需重新检查'}\n通过检查项：${r.passed}/${r.total}（不等于终审通过）\n\n## 需要修改\n${r.blockers.map((i,n)=>`${n+1}. [${i.id}] ${i.label}\n   依据：${i.excerpt||'缺少要求信息'}\n   动作：${i.suggestion}`).join('\n\n')||'当前配置规则未发现阻断项，仍需人工核对语义与素材。'}\n\n## 当前稿件\n${c.draftText}\n\n## 交付记录\n${Object.entries(c.deliverables).map(([k,v])=>`${{script:'完整脚本',video:'视频粗剪',cover:'封面图'}[k]}：${v?'已标记交付':'未交付'}`).join('\n')}\n\n## 素材记录\n${c.licenseNote||'未填写'}\n人工确认授权记录：${c.licenseConfirmed?'是':'否'}\n视频地址：${c.videoUrl||'未填写'}\n\n## 人工决定\n${c.decision==='approved'&&Engine.status(c).key==='approved'?'已批准':c.decision==='returned'?'已退回修改':'未批准'}\n${c.reviewNote||'未填写备注'}\n\n检查方式：本地关键词与字段规则，未调用实时 AI；工具不能验证视频画面或授权真实性。\n产品事实来源：https://cricketmedia.com/cricket-magazine-intro/（2026-09-12 核验）\n`;}
function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function promptModal(){const c=selected(),working=!!c.workingBrief,copy={...c,brief:c.workingBrief||c.brief,angle:c.workingAngle||c.angle};const text=(working?'【未发布编辑草稿，基于已保存 v'+c.version+'】\n':'')+Engine.promptText(copy);modal('在 AI 中继续深化 Brief',`<p>这份提示词包含创作者特征、产品事实和输出边界。${working?'当前使用尚未发布的编辑草稿。':'当前使用已保存 Brief。'}复制到你选择的模型中使用，再将结果带回人工核对。</p><textarea id="promptOutput" aria-label="结构化 AI 提示词" readonly>${esc(text)}</textarea><div class="actions top-gap"><button class="btn primary" data-action="copy-prompt">复制提示词</button><button class="btn" data-action="download-prompt">下载 TXT</button></div>`);}
async function runCheck(batch=false){
 if(scanBusy)return;scanBusy=true;
 const snapshots=(batch?state.creators:[selected()]).map(c=>({id:c.id,revision:c.revision,data:clone(c)}));
 const controls=[...document.querySelectorAll('[data-action="run-check"],[data-action="batch-check"]')];
 const labels=controls.map(el=>el.innerHTML);controls.forEach(el=>{el.disabled=true;el.innerHTML=icon('spark','spin')+' 检查中…';});
 modal('本地规则检查',`<div class="scan-heading"><span class="scan-symbol">${icon('spark')}</span><div><h3>核对 ${snapshots.length} 份稿件的 11 项要求</h3><p>依次读取当前正文、素材记录与版本信息</p></div></div><div id="scanConsole"></div><p class="scan-detail" id="scanDetail">准备检查…</p><p class="subtle-label">关键词和字段检查不替代人工终审。可按 Esc 取消。</p>`);
 $('dialog').classList.add('scan-dialog');
 const steps=['内容事实','表达风险','交付素材','版本一致'].map(category=>({label:category,run:()=>{const items=snapshots.flatMap(s=>Engine.check(s.data).items.filter(i=>i.category===category));return {category,total:items.length,failed:items.filter(i=>!i.pass).length};}}));
 const result=await window.CricketMotion.scan($('scanConsole'),steps,entry=>{if(entry.ok&&$('scanDetail'))$('scanDetail').textContent=`${entry.result.category}：检查 ${entry.result.total} 项，发现 ${entry.result.failed} 项待补正。`;});
 scanBusy=false;
 if(result.cancelled){controls.forEach((el,i)=>{if(el.isConnected){el.disabled=false;el.innerHTML=labels[i];}});toast('检查已取消，原有审核状态保留。');return;}
 if(result.results.some(r=>!r.ok)){controls.forEach((el,i)=>{if(el.isConnected){el.disabled=false;el.innerHTML=labels[i];}});toast('部分规则执行失败，请关闭后重试。');return;}
 let done=0,issues=0;snapshots.forEach(s=>{const c=state.creators.find(c=>c.id===s.id);if(c.revision===s.revision){c.checked=true;c.checkedRevision=c.revision;done++;issues+=Engine.check(c).blockers.length;}});
 log(`${batch?'批量':'返稿'}检查完成：${done} 份稿件，${issues} 项待补正`);save();$('dialog').close();render();toast(`检查完成 · ${done} 份稿件 · ${issues} 项待补正${done<snapshots.length?'；发生编辑的稿件需重新检查':''}`);
}

function loadURL(){const c=selected();let url;try{url=new URL(c.videoUrl);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error();}catch(e){toast('请填写有效的 HTTP 或 HTTPS 视频直链。');return;}clearPreview(c.id);previews.set(c.id,{src:url.href,name:url.hostname+' 的视频直链',local:false});mountPreview();}
function clearPreview(id){const old=previews.get(id);if(old?.local)URL.revokeObjectURL(old.src);previews.delete(id);}
function reset(){modal('重置此浏览器中的演示项目',`<p>将清除这份工具的本地编辑、版本与审核记录，并恢复 6 位创作者的初始示例。此操作仅影响本工具。</p><div class="actions"><button class="btn" data-action="export-project">先导出项目备份</button><button class="btn danger" data-action="confirm-reset">确认重置演示</button></div>`);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,c=selected();switch(a){
case'navigate':navigate(b.dataset.view);break;case'about':navigate('about');break;case'open-review':navigate('review',b.dataset.id);break;case'open-brief':navigate('brief',b.dataset.id);break;case'select':navigate(view,b.dataset.id);break;case'close':$('dialog').close();break;
case'filter':filter=b.dataset.filter;render();$('creatorTable').scrollIntoView({behavior:'smooth',block:'nearest'});break;
case'angle':{const angle=b.dataset.angle;const apply=()=>{c.workingBrief=Engine.generateBrief(c,angle);c.workingAngle=angle;save();render();toast('已生成“'+angle+'”方向草稿，保存新版本后生效。');};if(c.workingBrief){modal('重新生成方向草稿',`<p>将替换当前未发布的编辑草稿，已保存的 Brief v${c.version} 不变。</p><button class="btn primary" data-action="confirm-angle" data-angle="${esc(angle)}">替换为“${esc(angle)}”草稿</button>`);}else apply();break;}
case'confirm-angle':c.workingBrief=Engine.generateBrief(c,b.dataset.angle);c.workingAngle=b.dataset.angle;$('dialog').close();save();render();toast('方向草稿已更新。');break;
case'save-version':{const brief=c.workingBrief||c.brief,reason=(c.workingReason||'').trim();if(!reason){toast('请填写本次改版说明，便于追踪版本变化。');$('revisionReason').focus();break;}if(!Object.values(brief).every(v=>Array.isArray(v)?v.every(t=>t.trim()):v.trim())){toast('请补齐视频目标、镜头、创作边界与 CTA。');break;}if(JSON.stringify(brief)===JSON.stringify(c.brief)&&(c.workingAngle||c.angle)===c.angle){toast('Brief 内容尚未变化，无需创建重复版本。');break;}c.version++;c.brief=clone(brief);c.angle=c.workingAngle||c.angle;c.history.push({version:c.version,reason,at:new Date().toISOString(),brief:clone(c.brief),angle:c.angle});delete c.workingBrief;delete c.workingAngle;delete c.workingReason;invalidate(c);log(c.name+' 保存 Brief v'+c.version+'，旧稿需重新核对');save();render();toast('已保存 v'+c.version+'；旧返稿已触发版本重审。');break;}
case'history':{const h=c.history.find(h=>h.version===Number(b.dataset.version));modal('历史 Brief · v'+h.version,`<p>${esc(h.reason)}</p><div class="break-text">${esc(Engine.briefText({...c,version:h.version,brief:h.brief,angle:h.angle||c.angle}))}</div>`);break;}
case'prompt':promptModal();break;case'copy-prompt':try{await navigator.clipboard.writeText($('promptOutput').value);toast('提示词已复制。');}catch(e){$('promptOutput').select();toast('请按 Ctrl+C 复制已选中的提示词。');}break;case'download-prompt':download('CRICKET_AI提示词.txt',$('promptOutput').value);break;
case'run-check':runCheck(false);break;case'batch-check':runCheck(true);break;
case'sample-script':modal('载入合格示例脚本',`<p>将替换当前创作者的返稿正文。示例仅用于体验规则，不会补齐素材、不改变关联版本，也不会自动作出人工决定。</p><button class="btn primary" data-action="confirm-sample">替换正文并保留其他记录</button>`);break;
case'confirm-sample':c.draftText='这次用一个场景演示，介绍 CRICKET 的内容特点。它面向 9–14 岁读者，每年 6 期，内容包括小说、非虚构和诗歌，覆盖文化、历史、科学与艺术。你可以结合孩子已有的阅读基础与兴趣选择内容。你更想从哪个主题开始？在评论区留下你的选择。';invalidate(c);log(c.name+' 载入示例脚本，待重新检查');$('dialog').close();save();render();toast('已载入合格示例脚本，素材和版本仍需分别核对。');break;
case'approve':{const r=Engine.check(c);if(!(r.ready&&c.checked&&c.checkedRevision===c.revision&&c.humanConfirmed&&c.reviewNote.trim())){toast('当前不满足批准条件，请完成检查与人工复核。');break;}c.decision='approved';log(c.name+' 人工批准当前稿件 · Brief v'+c.version);save();render();toast('已记录人工批准。任何内容变更都会使该决定失效。');break;}
case'return':if(!c.reviewNote.trim()){toast('请填写具体修改意见再退回。');$('reviewNote').focus();break;}c.decision='returned';c.humanConfirmed=false;log(c.name+' 退回修改：'+c.reviewNote.slice(0,90));save();render();toast('已记录退回意见，可导出修改单。');break;
case'load-url':loadURL();break;case'clear-video':clearPreview(c.id);invalidate(c);save();render();toast('视频预览已清除，交付记录可另行调整。');break;
case'export-brief':download(safeName(c.name)+'_Brief_v'+c.version+'.md',Engine.briefText(c),'text/markdown;charset=utf-8');break;
case'export-review':download(safeName(c.name)+'_返稿修改单.md',reviewText(c),'text/markdown;charset=utf-8');break;
case'export-project':download('CRICKET_项目备份.json',JSON.stringify({exportedAt:new Date().toISOString(),dataType:'演示数据与用户本地修改，非真实历史业绩',...state},null,2),'application/json');break;
case'export-csv':{const rows=[['创作者','平台','方向','Brief版本','返稿版本','通过检查项','检查项总数','当前状态','待补正问题','数据类型'],...state.creators.map(c=>{const r=Engine.check(c);return [c.name,c.platform,c.angle,c.version,c.draftVersion,r.passed,r.total,Engine.status(c).label,r.blockers.map(i=>i.label).join('；'),'演示数据与本地修改'];})];download('CRICKET_协作清单.csv','\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');break;}
case'export-sim':{const v=simCalc(),s=state.sim;download('CRICKET_效率测算.md',`# 审核效率计划测算\n\n数据性质：假设推演，非实测成效。\n原流程：${s.count}位 × ${s.roundsBefore}轮 × ${s.minutesBefore}分钟 ÷ 60 = ${fmt(v.before)}小时\n辅助后：${s.count}位 × ${s.roundsAfter}轮 × ${s.minutesAfter}分钟 ÷ 60 = ${fmt(v.after)}小时\n预计释放：${fmt(v.saved)}小时，减少${fmt(v.rate)}%（负值表示增加）\n每位创作者按1份稿件计算，轮次包含首次审核。\n未计入一次性搭建、培训、素材制作与等待时间。\n需对同类稿件进行真实前后对照，并同时记录质量与返工，才能报告实测提效。`,'text/markdown;charset=utf-8');break;}
case'reset':reset();break;case'confirm-reset':previews.forEach((_,id)=>clearPreview(id));state=Engine.makeInitial();state.creators.forEach(c=>{c.history.forEach(h=>{if(h.version===c.version&&!h.brief){h.brief=clone(c.brief);h.angle=c.angle;}});});filter='all';search='';$('dialog').close();log('恢复初始演示项目');save();navigate('overview');toast('已恢复 6 位创作者的演示数据。');break;
}});
document.addEventListener('input',e=>{const t=e.target,c=selected();if(t.id==='creatorSearch'){search=t.value;refreshCreatorList();return;}if(t.dataset.brief||t.dataset.scene!==undefined){if(!c.workingBrief)c.workingBrief=clone(c.brief);if(t.dataset.brief)c.workingBrief[t.dataset.brief]=t.value;else c.workingBrief.scenes[Number(t.dataset.scene)]=t.value;save();$('draftIndicator').textContent='有未发布草稿 · 已自动暂存，保存新版本后生效';return;}if(t.id==='revisionReason'){c.workingReason=t.value;save();return;}if(t.dataset.sim){const n=Number(t.value);state.sim[t.dataset.sim]=Math.min(Number(t.max),Math.max(Number(t.min),Number.isFinite(n)?n:Number(t.min)));$('out-'+t.dataset.sim).textContent=state.sim[t.dataset.sim]+' '+(t.dataset.sim==='count'?'位':t.dataset.sim.includes('rounds')?'轮':'分钟');updateSimulation();save();return;}if(['draftText','licenseNote','videoUrl'].includes(t.id)){c[t.id]=t.value;if(t.id==='licenseNote')c.licenseConfirmed=false;if(t.id==='videoUrl')clearPreview(c.id);invalidate(c);save();refreshReview(true);if(t.id==='licenseNote')$('licenseConfirmed').checked=false;if(t.id==='videoUrl')mountPreview();return;}if(t.id==='reviewNote'){c.reviewNote=t.value;if(c.decision==='approved'){c.decision='pending';c.humanConfirmed=false;$('humanConfirmed').checked=false;$('reviewStatus').innerHTML=badge(Engine.status(c));}save();updateApprove();}});
document.addEventListener('change',e=>{const t=e.target,c=selected();if(t.dataset.delivery){c.deliverables[t.dataset.delivery]=t.checked;invalidate(c);save();refreshReview(true);}else if(t.id==='draftVersion'){c.draftVersion=Number(t.value);invalidate(c);save();refreshReview(true);}else if(t.id==='licenseConfirmed'){c.licenseConfirmed=t.checked;invalidate(c);save();refreshReview(true);}else if(t.id==='humanConfirmed'){c.humanConfirmed=t.checked;if(!t.checked)c.decision='pending';save();updateApprove();$('reviewStatus').innerHTML=badge(Engine.status(c));}else if(t.id==='videoFile'){const f=t.files[0];if(!f)return;if(!f.type.startsWith('video/')&&!/\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name)){toast('请选择支持的视频文件。');return;}clearPreview(c.id);previews.set(c.id,{src:URL.createObjectURL(f),name:f.name,local:true});invalidate(c);save();refreshReview(true);mountPreview();}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
window.addEventListener('beforeunload',()=>previews.forEach((_,id)=>clearPreview(id)));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();toast('已保存到当前浏览器。Brief 草稿需点击保存新版本后发布。');}});
function sensitivityChart(){const s=state.sim,unitBefore=s.roundsBefore*s.minutesBefore/60,unitAfter=s.roundsAfter*s.minutesAfter/60,maxValue=Math.max(unitBefore,unitAfter)*100,max=Math.ceil(maxValue/4)*4||4,x=n=>52+n/100*536,y=v=>178-v/max*142,pointsBefore=[0,25,50,75,100].map(n=>`${x(n)},${y(n*unitBefore)}`).join(' '),pointsAfter=[0,25,50,75,100].map(n=>`${x(n)},${y(n*unitAfter)}`).join(' ');return `<section class="panel sensitivity-panel"><div class="panel-head"><div><h2>协作规模与审核工作量</h2><p>按当前轮次和单次耗时推演，点击节点切换人数</p></div><div class="chart-legend"><span><i style="background:#aab8a2"></i>原流程</span><span><i style="background:var(--green)"></i>工具辅助</span></div></div><div class="sensitivity-wrap"><svg class="sensitivity-chart" viewBox="0 0 640 220" role="group" aria-label="固定当前耗时假设，展示0到100位创作者对应的审核小时数"><text x="10" y="17" class="chart-unit">小时</text>${[0,1,2,3,4].map(i=>`<line x1="52" x2="588" y1="${y(i*max/4)}" y2="${y(i*max/4)}" class="chart-grid"/><text x="42" y="${y(i*max/4)+4}" text-anchor="end" class="chart-tick">${fmt(i*max/4)}</text>`).join('')}<polygon points="${pointsBefore} ${[100,75,50,25,0].map(n=>`${x(n)},${y(n*unitAfter)}`).join(' ')}" fill="${unitBefore>=unitAfter?'#dce9d6':'#f4ded3'}" opacity=".45"/><polyline class="chart-line before" points="${pointsBefore}"/><polyline class="chart-line after" points="${pointsAfter}"/><g class="current-count-marker"><line x1="${x(s.count)}" x2="${x(s.count)}" y1="30" y2="182" stroke="#c6a479" stroke-dasharray="3 4"/><circle cx="${x(s.count)}" cy="${y(s.count*unitBefore)}" r="5" fill="#aab8a2" stroke="white" stroke-width="2"/><circle cx="${x(s.count)}" cy="${y(s.count*unitAfter)}" r="5" fill="var(--green)" stroke="white" stroke-width="2"/></g>${[0,25,50,75,100].map(n=>`<text x="${x(n)}" y="205" class="chart-tick" text-anchor="middle">${n}</text>${n?`<circle class="sensitivity-point" cx="${x(n)}" cy="${y(n*unitAfter)}" r="13" fill="transparent" data-action="sim-count" data-count="${n}" role="button" tabindex="0" aria-label="测算${n}位创作者"><title>${n} 位：原流程 ${fmt(n*unitBefore)} h / 工具辅助 ${fmt(n*unitAfter)} h</title></circle>`:''}`).join('')}<text x="604" y="205" class="chart-unit">人</text></svg></div><div class="sensitivity-detail"><span>当前规模 <b>${s.count} 位</b></span><span>原流程 <b>${fmt(s.count*unitBefore)} h</b></span><span>辅助后 <b>${fmt(s.count*unitAfter)} h</b></span></div><div class="insight-note">${icon('about')}线条表示公式推演，不是历史趋势；尚未计入搭建、培训和等待时间。</div></section>`;}
function updateSimulation(){const previous=$('simSavedValue')?.querySelector('[data-motion-number]')?.textContent||$('simSavedValue')?.textContent||'0';const widths=[...document.querySelectorAll('#simResult .bar-fill')].map(el=>el.style.width);$('simResult').innerHTML=simResults();const el=$('simSavedValue'),target=Math.abs(simCalc().saved);el.textContent=previous;window.CricketMotion.updateMetric(el,target,{digits:1});if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('#simResult .bar-fill').forEach((bar,i)=>{const end=bar.style.width;bar.style.width=widths[i]||'0%';void bar.offsetWidth;requestAnimationFrame(()=>{if(bar.isConnected)bar.style.width=end;});});}if($('sensitivityArea'))$('sensitivityArea').innerHTML=sensitivityChart();}
function refreshCreatorList(){if(!$('creatorListArea'))return;$('creatorListArea').innerHTML=renderCreatorList();$('resultsCount').textContent=`当前展示 ${filteredCreators().length} / ${state.creators.length} 位创作者 · 演示数据`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){
 case'quick-view':quickView(b.dataset.id);break;
 case'drawer-review':$('dialog').close();navigate('review',b.dataset.id);break;
 case'drawer-brief':$('dialog').close();navigate('brief',b.dataset.id);break;
 case'risk-filter':riskCategory=b.dataset.categoryLabel;filter='all';render();$('creatorTable').scrollIntoView({behavior:'smooth',block:'start'});break;
 case'clear-category':riskCategory='';render();$('creatorTable').scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case'clear-filters':riskCategory='';filter='all';search='';render();$('creatorTable').scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case'list-mode':listMode=b.dataset.mode;render();$('creatorTable').scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case'commands':commandPalette();break;
 case'command-open':$('dialog').close();navigate(b.dataset.view,b.dataset.id);break;
 case'sim-count':state.sim.count=Number(b.dataset.count);$('sim-count').value=state.sim.count;$('out-count').textContent=state.sim.count+' 位';updateSimulation();save();break;
 case'sim-preset':{const presets={pilot:{count:6,roundsBefore:3,roundsAfter:2,minutesBefore:20,minutesAfter:15},standard:{count:50,roundsBefore:3,roundsAfter:2,minutesBefore:20,minutesAfter:12},intensive:{count:100,roundsBefore:4,roundsAfter:3,minutesBefore:25,minutesAfter:18}};state.sim={...presets[b.dataset.preset]};render();toast('已应用一组测算假设，可继续调整。');save();break;}
}});
document.addEventListener('input',e=>{if(e.target.id==='commandSearch')$('commandResults').innerHTML=commandResults(e.target.value.trim());});
function donutFocus(category){if(view!=='overview'||!$('donutValue'))return;const m=Engine.metrics(state.creators),item=m.categories.find(c=>c.label===category);document.querySelectorAll('.risk-segment').forEach(el=>el.classList.toggle('dimmed',!!item&&el.dataset.category!==category));$('donutValue').textContent=item?item.count:m.issueCount;$('donutValue').setAttribute('aria-label',String(item?item.count:m.issueCount));$('donutLabel').textContent=item?item.label:'待补正检查项';$('donutPercent').textContent=item?`${m.issueCount?Math.round(item.count/m.issueCount*100):0}% · 点击筛选稿件`:`${m.blocked} 份稿件待处理`;}
document.addEventListener('pointerover',e=>{const target=e.target.closest('[data-category-label]');if(target)donutFocus(target.dataset.categoryLabel);});
document.addEventListener('pointerout',e=>{const target=e.target.closest('[data-category-label]');if(target&&!target.contains(e.relatedTarget))donutFocus('');});
document.addEventListener('focusin',e=>{const target=e.target.closest('[data-category-label]');if(target)donutFocus(target.dataset.categoryLabel);});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-category-label]'))donutFocus('');});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('dialog').open)commandPalette();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('circle[data-action]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}if($('dialog').classList.contains('command-dialog')&&$('dialog').open){const buttons=[...$('commandResults').querySelectorAll('.command-result')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();buttons[(i+1)%buttons.length]?.focus();}if(e.key==='ArrowUp'){e.preventDefault();buttons[i<1?buttons.length-1:i-1]?.focus();}if(e.key==='Enter'&&e.target.id==='commandSearch'){e.preventDefault();buttons[0]?.click();}}});
$('dialog').addEventListener('close',()=>{if(scanBusy)window.CricketMotion.dispose();$('dialog').classList.remove('quick-dialog','command-dialog','scan-dialog');});

view=navs.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview';render();
})();
</script>
